<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#042019"/>
      <stop offset="50%" stopColor="#02140f"/>
      <stop offset="100%" stopColor="#010a07"/>
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399"/>
      <stop offset="60%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>

    <!-- Radiant Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="45%" stopColor="#facc15"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>

    <!-- Cyan Pulse Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#67e8f9"/>
      <stop offset="100%" stopColor="#06b6d4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Hex Shield Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Radar Scanning Grid Rings -->
  <circle cx="32" cy="32" r="24" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="17" stroke="#34d399" stroke-width="0.9" stroke-opacity="0.35"/>
  <circle cx="32" cy="32" r="9" stroke="#facc15" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Radar Beam Sweep Fan (Quarter Arc) -->
  <path d="M32 32 L49 15 A24 24 0 0 1 56 32 Z" fill="url(#goldGrad)" fill-opacity="0.25"/>

  <!-- Reticle Alignment Axes -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Iconic High-Tech Monogram: Interlocking 'T' and 'R' -->
  <!-- Top T Bar (Emerald to Cyan with glow) -->
  <path d="M16 20 H48" stroke="url(#emeraldGrad)" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Vertical T Stem -->
  <path d="M32 20 V46" stroke="url(#emeraldGrad)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Radar 'R' Upper Curved Loop (Radiant Gold) -->
  <path d="M32 20 H41 C46.5 20 49 23 49 27 C49 31 46.5 34 41 34 H32" stroke="url(#goldGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Dynamic Radar 'R' High-Velocity Kick Leg -->
  <path d="M39 34 L49 46" stroke="url(#goldGrad)" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Optical Waveguide Junction Core (Central Photon Emitter) -->
  <circle cx="32" cy="20" r="3.2" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
  <circle cx="32" cy="20" r="1.5" fill="#ffffff"/>

  <!-- Telemetry Sensor Nodes -->
  <circle cx="16" cy="20" r="2.2" fill="#67e8f9"/>
  <circle cx="49" cy="46" r="2.2" fill="#facc15"/>
  <circle cx="32" cy="46" r="1.8" fill="#34d399"/>

  <!-- Active Telemetry Beacon in Top Right -->
  <circle cx="51" cy="13" r="3.5" fill="#facc15" fill-opacity="0.4"/>
  <circle cx="51" cy="13" r="2" fill="#fef08a"/>
</svg>
